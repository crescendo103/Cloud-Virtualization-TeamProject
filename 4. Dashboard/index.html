<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Training Dashboard</title>
    <link rel="stylesheet" href="/dashboard/styles.css?v=svg-charts-2" />
  </head>
  <body>
    <main class="dashboard">
      <header class="topbar">
        <div>
          <p class="eyebrow">Dashboard</p>
          <h1>학습 진행 상황</h1>
        </div>
        <a href="/input/">새 작업 요청</a>
      </header>

      <section class="metrics">
        <article>
          <span>GPU</span>
          <strong id="gpu-summary">확인 중</strong>
        </article>
        <article>
          <span>예측 요청 수</span>
          <strong id="prediction">0</strong>
        </article>
        <article>
          <span>작업 수</span>
          <strong id="job-count">0</strong>
        </article>
      </section>

      <section class="charts">
        <div class="panel">
          <h2>Loss</h2>
          <div class="chart-box">
            <svg id="loss-chart" class="chart-svg" viewBox="0 0 600 220" role="img" aria-label="Epoch별 학습 및 검증 Loss"></svg>
            <p id="loss-empty" class="chart-empty">학습 기록이 없습니다.</p>
          </div>
        </div>

        <div class="panel">
          <h2>Accuracy</h2>
          <div class="chart-box">
            <svg id="accuracy-chart" class="chart-svg" viewBox="0 0 600 220" role="img" aria-label="Epoch별 학습 및 검증 Accuracy"></svg>
            <p id="accuracy-empty" class="chart-empty">학습 기록이 없습니다.</p>
          </div>
        </div>

        <div class="panel">
          <h2>GPU 사용률</h2>
          <div class="chart-box">
            <svg id="gpu-chart" class="chart-svg" viewBox="0 0 600 220" role="img" aria-label="GPU 사용률 및 메모리 사용률"></svg>
            <p id="gpu-empty" class="chart-empty">GPU가 없습니다. (CPU fallback)</p>
          </div>
        </div>
      </section>

      <section class="content">
        <div class="panel">
          <h2>작업 큐</h2>
          <div id="jobs" class="jobs"></div>
        </div>

        <div class="panel">
          <h2>선택 작업</h2>
          <pre id="job-detail">작업을 선택하세요.</pre>
          <div class="analysis">
            <button id="analyze-button" type="button">AI 분석</button>
            <div id="analysis-result" class="analysis-result" hidden></div>
          </div>
        </div>
      </section>
    </main>

    <script src="/dashboard/app.js?v=svg-charts-2"></script>
  </body>
</html>
